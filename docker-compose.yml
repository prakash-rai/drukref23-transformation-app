# Production: runs on the ArcGIS/IIS Windows server (Docker Desktop or Docker Engine in WSL 2). See docs/deployment.md.
# IIS publishes https://cadastral.systems.gov.bt/drukref/ and proxies to 127.0.0.1:${APP_PORT}.
services:
  web:
    build:
      context: .
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/drukref/}
    # Set IMAGE_TAG in .env to the release version to allow rollback (docs/deployment.md).
    image: drukref-transformation-tool:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # ArcGIS credentials and settings (see .env.example). Read at runtime only.
    env_file: .env
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      # Loopback only: the app is reachable solely through IIS.
      - "127.0.0.1:${APP_PORT:-8080}:3000"
    # If api/health reports "Cannot reach ArcGIS Server" (DNS / hairpin NAT), uncomment and set this
    # server's LAN IP (ipconfig) so the container reaches IIS directly with the correct certificate:
    # extra_hosts:
    #   - "cadastral.systems.gov.bt:10.0.0.10"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000' + (process.env.APP_BASE_PATH || '/drukref/')).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
